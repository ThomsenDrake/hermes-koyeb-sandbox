[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-koyeb-sandbox"
version = "0.1.0"
description = "Koyeb Sandbox terminal backend for Hermes Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["koyeb-sdk>=1.5.2,<2"]

[project.urls]
Homepage = "https://github.com/ThomsenDrake/hermes-koyeb-sandbox"
Issues = "https://github.com/ThomsenDrake/hermes-koyeb-sandbox/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hermes_koyeb_sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
